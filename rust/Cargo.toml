[package]
name = "orca_rust_bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "orca_rust_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
solana-client = "1.18"
solana-sdk = "1.18"
solana-program = "1.18"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
anyhow = "1.0"
hex = "0.4"
bs58 = "0.5"

[dependencies.pyo3]
version = "0.21"
features = ["extension-module", "abi3-py310"]

[dependencies.pyo3-asyncio]
version = "0.21"
features = ["attributes", "unstable-streams", "tokio-runtime"]

[build-dependencies]
pyo3-build-config = "0.21"